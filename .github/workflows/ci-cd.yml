name: CI/CD

on:
  push:
    branches:
      - main
    paths:
      - src/**/*
      - tests/**/*
      - .github/workflows/**/*
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
          # cache: true
      # - name: Cache NuGet packages
      #   uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      #   with:
      #     path: ~/.nuget/packages
      #     key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
      #     restore-keys: |
      #       nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore dotnet-timestamp.sln
      - name: Build
        run: dotnet build dotnet-timestamp.sln --configuration Release --no-restore
      - name: E2E tests
        run: dotnet test tests/Timestamp.E2E.Test/Timestamp.E2E.Test.csproj --configuration Release --no-build
      - name: Pack tool (NuGet)
        run: dotnet pack src/Timestamp/Timestamp.csproj --configuration Release --no-build -p:PackageOutputPath=./artifacts
      - name: Upload package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dotnet-timestamp-nuget
          path: src/Timestamp/artifacts/*.nupkg

  cd:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-timestamp-nuget
          path: ./packages
      
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.2.0
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./packages/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./packages/*.nupkg -k $NUGET_API_KEY -s https://api.nuget.org/v3/index.json --skip-duplicate
