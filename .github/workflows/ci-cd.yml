name: CI/CD

on:
  push:
    paths:
      - src/**/*
      - tests/**/*
      - .github/workflows/*
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up .NET
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: '10.0.x'
          cache: true
      - name: Cache NuGet packages
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore dotnet-timestamp.sln
      - name: Build
        run: dotnet build dotnet-timestamp.sln --configuration Release --no-restore
      - name: E2E tests
        run: dotnet test tests/Timestamp.E2E.Test/Timestamp.E2E.Test.csproj --configuration Release --no-build
      - name: Pack tool (NuGet)
        run: dotnet pack src/Timestamp/Timestamp.csproj --configuration Release --no-build -p:PackageOutputPath=./artifacts
      - name: Upload package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dotnet-timestamp-nuget
          path: artifacts/*.nupkg

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder deploy
        run: echo "CD placeholder - replace with deployment script"
